[project]
name = "ai-handoff-protocol"
version = "0.0.1"
description = "Portable, auditable, file-first handoff protocol for AI assistants."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0",
  "pyyaml>=6.0",
]

[project.scripts]
ai-handoff-protocol = "ai_handoff_protocol.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_handoff_protocol"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
